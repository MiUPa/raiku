name: Daily Gemini Future Prediction

on:
  schedule:
    # 毎日 UTC 15:00 (日本時間 JST 0:00) に自動実行
    - cron: '0 15 * * *'
  workflow_dispatch: # 手動実行トリガー

jobs:
  generate:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Generate New Prediction
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: node scripts/generate-prediction.js

      - name: Commit and Push Changes
        run: |
          git config --global user.name "RAIKU-Gemini-Bot"
          git config --global user.email "bot@raiku.llc"
          git add data/predictions.json
          git diff --quiet && git diff --staged --quiet || (git commit -m "feat(daily): add daily prediction by Gemini AI [skip ci]" && git push)
